<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KT Feedback — Детализация обращений</title>
  <style>
    :root {
      --bg: #0f1419;
      --sidebar: #111827;
      --surface: #1a2332;
      --surface2: #243044;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --pos: #34d399;
      --neg: #f87171;
      --neu: #fbbf24;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .layout { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    .sidebar {
      background: var(--sidebar); border-right: 1px solid var(--border); padding: 20px 14px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .brand { font-weight: 700; font-size: 15px; padding: 8px 10px; color: #fff; }
    .brand span { display: block; font-size: 11px; color: var(--muted); font-weight: 500; margin-top: 4px; }
    .nav a {
      display: block; padding: 10px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: 13px;
    }
    .nav a:hover { background: var(--surface2); color: var(--text); }
    .nav a.active { background: var(--accent); color: #fff; }
    main { padding: 20px 24px 32px; overflow: hidden; display: flex; flex-direction: column; gap: 16px; }
    .topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font-size: 20px; }
    .hint { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    select, input[type="search"] {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 8px 10px; font-size: 13px;
    }
    input[type="search"] { min-width: 220px; }
    .badge { font-size: 12px; color: var(--muted); }
    .table-wrap {
      flex: 1; overflow: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
    }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    thead { position: sticky; top: 0; z-index: 2; background: #1e293b; }
    th { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th .col-filter { display: block; margin-top: 6px; width: 100%; max-width: 140px; padding: 4px 6px; font-size: 11px; }
    td { padding: 8px; border-bottom: 1px solid #2a3548; vertical-align: top; }
    td.text { max-width: 420px; line-height: 1.4; color: #e2e8f0; }
    tr:hover td { background: rgba(59, 130, 246, 0.08); }
    .sent-pos { color: var(--pos); font-weight: 600; }
    .sent-neg { color: var(--neg); font-weight: 600; }
    .sent-neu { color: var(--neu); }
    .pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
    .pager button {
      background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 6px 12px; cursor: pointer;
    }
    .pager button:disabled { opacity: 0.4; cursor: default; }
    #loadStatus { color: var(--muted); font-size: 13px; }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { flex-direction: row; flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">KT Feedback<span>Back-office</span></div>
      <nav class="nav">
        <a href="index.html">← Аналитика</a>
        <a href="records.html" class="active">Детализация обращений</a>
        <a href="detail.html">Сводные таблицы</a>
      </nav>
    </aside>
    <main>
      <div class="topbar">
        <div>
          <h1>Детализация обращений</h1>
          <p class="hint" id="metaHint">Загрузка…</p>
        </div>
        <div class="toolbar">
          <label class="badge">Источник
            <select id="fSource">
              <option value="all">Все</option>
              <option value="external">OUTSOURCE</option>
              <option value="internal">INSOURCE</option>
            </select>
          </label>
          <input type="search" id="globalSearch" placeholder="Поиск по тексту…" />
        </div>
      </div>
      <div id="loadStatus"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Дата<input class="col-filter" data-col="date" placeholder="🔍" /></th>
              <th>Источник<input class="col-filter" data-col="source_label" placeholder="🔍" /></th>
              <th>cv_sentiment<input class="col-filter" data-col="sentiment" placeholder="🔍" /></th>
              <th>Регион<input class="col-filter" data-col="region" placeholder="🔍" /></th>
              <th>Платформа<input class="col-filter" data-col="platform" placeholder="🔍" /></th>
              <th>Категория<input class="col-filter" data-col="category" placeholder="🔍" /></th>
              <th>Тема<input class="col-filter" data-col="topic" placeholder="🔍" /></th>
              <th>Текст</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="pager">
        <span class="badge" id="pageInfo"></span>
        <button type="button" id="prevBtn">Назад</button>
        <button type="button" id="nextBtn">Вперёд</button>
      </div>
    </main>
  </div>
  <script>
    const PAGE = 100;
    let allRows = [];
    let filtered = [];
    let page = 0;
    const colFilters = {};

    function sentClass(s) {
      const v = (s || "").toLowerCase();
      if (v === "positive") return "sent-pos";
      if (v === "negative") return "sent-neg";
      return "sent-neu";
    }

    async function loadData() {
      const status = document.getElementById("loadStatus");
      status.textContent = "Загрузка данных…";
      const [ext, intWrap] = await Promise.all([
        fetch("data/rows_external.json").then(r => r.json()),
        fetch("data/rows_internal.json").then(r => r.json()),
      ]);
      const intRows = intWrap.rows || [];
      allRows = ext.concat(intRows);
      document.getElementById("metaHint").textContent =
        `OUTSOURCE ${ext.length.toLocaleString()} · INSOURCE ${intWrap.meta?.sample_size?.toLocaleString() || intRows.length} из ${(intWrap.meta?.total_internal || intRows.length).toLocaleString()} (веб-выборка)`;
      status.textContent = "";
      applyFilters();
    }

    function applyFilters() {
      const src = document.getElementById("fSource").value;
      const q = (document.getElementById("globalSearch").value || "").toLowerCase().trim();
      filtered = allRows.filter(r => {
        if (src !== "all" && r.source !== src) return false;
        if (q && !(r.text || "").toLowerCase().includes(q)) return false;
        for (const [col, val] of Object.entries(colFilters)) {
          if (!val) continue;
          const cell = String(r[col] || "").toLowerCase();
          if (!cell.includes(val.toLowerCase())) return false;
        }
        return true;
      });
      page = 0;
      render();
    }

    function render() {
      const start = page * PAGE;
      const slice = filtered.slice(start, start + PAGE);
      const tb = document.getElementById("tbody");
      tb.innerHTML = slice.map(r => `
        <tr>
          <td>${r.date || ""}</td>
          <td>${r.source_label || ""}</td>
          <td class="${sentClass(r.sentiment)}">${r.sentiment || ""}</td>
          <td>${r.region || ""}</td>
          <td>${r.platform || ""}</td>
          <td>${r.category || ""}</td>
          <td>${r.topic || ""}</td>
          <td class="text">${r.text || ""}</td>
        </tr>`).join("") || "<tr><td colspan='8'>Нет строк</td></tr>";
      const pages = Math.max(1, Math.ceil(filtered.length / PAGE));
      document.getElementById("pageInfo").textContent =
        `${filtered.length.toLocaleString()} строк · стр. ${page + 1} / ${pages}`;
      document.getElementById("prevBtn").disabled = page <= 0;
      document.getElementById("nextBtn").disabled = page >= pages - 1;
    }

    document.querySelectorAll(".col-filter").forEach(inp => {
      inp.addEventListener("input", () => {
        colFilters[inp.dataset.col] = inp.value.trim();
        applyFilters();
      });
    });
    document.getElementById("fSource").onchange = applyFilters;
    document.getElementById("globalSearch").oninput = applyFilters;
    document.getElementById("prevBtn").onclick = () => { if (page > 0) { page--; render(); } };
    document.getElementById("nextBtn").onclick = () => {
      if ((page + 1) * PAGE < filtered.length) { page++; render(); }
    };

    loadData().catch(err => {
      document.getElementById("loadStatus").textContent = "Ошибка загрузки: " + err.message;
    });
  </script>
</body>
</html>
